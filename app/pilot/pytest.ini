[pytest]
# Discover all test_*.py files under tests/
testpaths = tests
asyncio_mode = auto

# Show short tracebacks for cleaner CI output
addopts =
    -q
    --tb=short
    --no-header

# Filter noisy deprecation warnings from third-party packages
filterwarnings =
    ignore::DeprecationWarning:pydantic
    ignore::DeprecationWarning:sqlalchemy
