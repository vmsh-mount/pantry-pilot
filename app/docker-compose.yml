services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     pantrypilot
      POSTGRES_PASSWORD: pantrypilot
      POSTGRES_DB:       pantrypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U pantrypilot"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ── Migrations (runs once, then exits) ────────────────────────────────────
  # Ensures schema is up to date before pilot starts.
  migrate:
    build: ./pilot
    env_file:
      - ./pilot/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  # ── Pilot (FastAPI — planning brain) ─────────────────────────────────────
  pilot:
    build: ./pilot
    ports:
      - "8000:8000"
    env_file:
      - ./pilot/.env
    volumes:
      - ./pilot:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ── Pilot Worker (Celery) ─────────────────────────────────────────────────
  pilot-worker:
    build: ./pilot
    env_file:
      - ./pilot/.env
    volumes:
      - ./pilot:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --queues=planning,pantry,whatsapp,maintenance,nutrition
      --concurrency=4

  # ── Pilot Beat (Scheduler) ────────────────────────────────────────────────
  pilot-beat:
    build: ./pilot
    env_file:
      - ./pilot/.env
    volumes:
      - ./pilot:/app
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler

  # ── Cockpit (Next.js — user interface) ───────────────────────────────────
  cockpit:
    build:
      context:    ./cockpit
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./cockpit/.env.local
    volumes:
      - ./cockpit:/app
      - cockpit_node_modules:/app/node_modules
      - cockpit_next:/app/.next
    environment:
      # Override to use Docker internal networking for SSR calls
      NEXT_PUBLIC_API_URL: http://pilot:8000
    depends_on:
      pilot:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  cockpit_node_modules:
  cockpit_next:
